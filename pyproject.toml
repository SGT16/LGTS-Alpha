[project]
name = "lgts-alpha"
version = "1.0.0"
description = "Multi-dataset and multi-architecture evaluation of the LGTS-Alpha activation function"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "pillow>=10,<13",
  "medmnist>=3.0,<4",
  "datasets>=3.0,<5",
  "openpyxl>=3.1,<4",
  "tqdm>=4.66,<5",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
]

[tool.uv]
package = false

